name: Sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar fotos de especies desde Wikimedia Commons
        run: node scripts/fetch-images.mjs
      - name: Descargar relieve (SRTM) y senderos (OpenStreetMap) si faltan
        run: |
          if [ ! -f data/terrain.json ] || [ ! -f data/osm-raw.json ]; then
            npm install --no-save --no-audit --no-fund pngjs@7.0.0
            node scripts/fetch-terrain.mjs
          else
            echo "Datos de terreno ya presentes"
          fi
      - name: Guardar fotos y datos nuevos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar fotos y datos de terreno"
            git push
          fi
      - name: Construir el sitio
        run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
